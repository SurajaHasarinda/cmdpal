name: release

# Publish by pushing a tag that matches the version in Cargo.toml:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: cmdpal.exe
          - os: ubuntu-latest
            # The Linux binary is linked against the glibc of the machine that builds it.
            # ubuntu-latest carries glibc 2.39, which refuses to run on Ubuntu 20.04 (2.31).
            # Building in a 20.04 container pins the baseline to glibc 2.31, which still
            # runs on 20.04, 22.04, 24.04, Debian 11+ and RHEL 9+.
            container: ubuntu:20.04
            target: x86_64-unknown-linux-gnu
            exe: cmdpal
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version v$version"
            exit 1
          fi

      # keyring's secret-service backend compiles against the system libdbus (libdbus-sys);
      # there is no musl build of libdbus, so the release targets glibc Linux.
      # Must precede the toolchain action, which needs curl to install rustup.
      # Container jobs run as root, so there is no sudo here.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils ca-certificates curl git libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      # A binary linked on a newer glibc dies at startup on older servers with
      # "GLIBC_x.y not found". Assert the ceiling so that stays caught in CI.
      - name: Verify glibc baseline
        if: runner.os == 'Linux'
        run: |
          bin="target/${{ matrix.target }}/release/cmdpal"
          max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "binary needs glibc up to $max (baseline GLIBC_2.31)"
          if [ "$(printf '%s\n' GLIBC_2.31 "$max" | sort -V | tail -1)" != GLIBC_2.31 ]; then
            echo "::error::$bin requires $max, newer than the GLIBC_2.31 baseline"
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          mkdir stage dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" LICENSE README.md stage/
          if [ "${{ matrix.exe }}" = "cmdpal.exe" ]; then
            7z a "dist/cmdpal-${{ matrix.target }}.zip" ./stage/*
          else
            tar -czf "dist/cmdpal-${{ matrix.target }}.tar.gz" -C stage .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: Checksums and installers
        run: |
          cp install.sh install.ps1 dist/
          chmod +x dist/install.sh
          cd dist
          sha256sum cmdpal-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  # A broken installer must fail the release before anyone can download it.
  smoke:
    needs: assemble
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Linux install, run, uninstall
        if: runner.os == 'Linux'
        run: |
          export CMDPAL_BASE_URL="$PWD/dist" CMDPAL_INSTALL_DIR="$RUNNER_TEMP/bin"
          cat dist/install.sh | sh
          "$RUNNER_TEMP/bin/cmdpal" --version
          test "$("$RUNNER_TEMP/bin/cmdpal" --pick 1 delete directory)" = 'rm -rf {path}'
          sh dist/install.sh --uninstall
          test ! -e "$RUNNER_TEMP/bin/cmdpal"

      - name: Windows install, run, uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "cmdpal"
          .\dist\install.ps1 -BaseUrl "$PWD\dist" -InstallDir $dir -NoPathUpdate
          & "$dir\cmdpal.exe" --version
          $picked = & "$dir\cmdpal.exe" --pick 1 delete directory
          if ($picked -ne 'Remove-Item -Recurse -Force {path}') { throw "unexpected result: $picked" }
          .\dist\install.ps1 -Uninstall -InstallDir $dir
          if (Test-Path $dir) { throw "uninstall left files behind" }

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      # Attestations need a public repo (or GitHub Enterprise); don't block the release without them.
      - uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: dist/cmdpal-*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

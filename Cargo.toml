[package]
name = "cmdpal"
version = "0.1.5"
edition = "2021"
description = "Command palette for terminal - search commands by natural language"
license = "MIT"
repository = "https://github.com/SurajaHasarinda/cmdpal"
readme = "README.md"
keywords = ["cli", "terminal", "command", "palette", "search", "productivity"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
fuzzy-matcher = "0.3"
git2 = { version = "0.18", default-features = false }
arboard = "3.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
lz4_flex = "0.11"
ureq = { version = "3", features = ["json", "rustls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
zeroize = "1"

[build-dependencies]
lz4_flex = "0.11"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "cmdpal"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
members = []
